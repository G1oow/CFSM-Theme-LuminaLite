name: Build theme

# 源码在 main，构建产物（index.html + assets/）自动发布到 dist 分支。
# 主题安装地址就填 dist 分支：
#   https://github.com/<owner>/<repo>/tree/dist
#
# preview 分支同理，产物发到 dist-preview，用来在后台临时切地址验收，
# 不会动到线上用的 dist。
#
# 产物提交的说明就是主题商店里的「更新日志」和版本下拉的标题，格式是
#   v<package.json 的 version> <更新日志>
# 更新日志默认取本次源码提交的标题（合并提交取 PR 标题 / 被合进来的最后一次提交标题）；
# 手动触发时可以在 changelog 里另写一句。
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      changelog:
        description: "更新日志（留空则用最近一次源码提交的标题）"
        required: false
        type: string
      force:
        description: "产物没变化也发布一版（只想改更新日志时用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 连续推送时只保留最后一次构建，避免两个 job 抢着往同一个分支推。
# main 与 preview 各自排队，互不打断。
concurrency:
  group: build-theme-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 合并提交要往前找被合进来的最后一次提交标题，只拉 1 层历史找不到。
          fetch-depth: 50

      - name: Resolve target branch
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "preview" ]; then
            echo "branch=dist-preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=dist" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 版本号来自 package.json，发布新版本前记得 npm version / 手改一下。
      - name: Compose release note
        id: note
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          # 优先级：手动填的 changelog > 本次源码提交的标题。
          # 原来第二优先是 CHANGELOG.md 里当前版本那段的第一行，版本号不变时每次产物说明都一模一样，
          # 分不出哪次构建改了什么，所以改成直接用提交标题。
          note="${CHANGELOG:-}"
          if [ -z "${note}" ]; then
            note="$(git log -1 --pretty=%s)"
            case "${note}" in
              Merge\ *)
                # 合并提交：GitHub 网页合并 PR 时正文第一行是 PR 标题，优先用它；
                # 本地合并（GitHub Desktop 的 Merge into current branch）没有正文，退回被合进来的最后一次提交标题。
                # awk 读完整段再只打印第一条非空行：用 head 提前退出会让上游吃 SIGPIPE，配 pipefail 整步失败。
                pr_title="$(git log -1 --pretty=%b | awk 'NF && !done { print; done = 1 }')"
                if [ -n "${pr_title}" ]; then
                  note="${pr_title}"
                else
                  last="$(git log -1 --no-merges --pretty=%s || true)"
                  [ -n "${last}" ] && note="${last}"
                fi
                ;;
            esac
          fi
          {
            echo "message<<RELEASE_NOTE_EOF"
            echo "${version} ${note}"
            echo
            echo "build: ${GITHUB_SHA::7}"
            echo "RELEASE_NOTE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "本次产物说明：${version} ${note}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 主题目录只允许 index.html 和 assets/，构建配置若被改坏要在这里拦下来。
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          test -d dist/assets || { echo "缺少 dist/assets/"; exit 1; }
          unexpected="$(find dist -mindepth 1 -maxdepth 1 ! -name index.html ! -name assets)"
          if [ -n "$unexpected" ]; then
            echo "产物里出现了不允许的顶层文件："
            echo "$unexpected"
            exit 1
          fi

      # 产物分支必须保留历史：主题商店的 versions[].commitid 指向某次构建的 commit，
      # 用户也可能把主题地址锁在 40 位 SHA 上。一旦 force-push 覆盖，这些旧地址就会失效，
      # 所以这里是在已有分支上追加提交，不重建、不强推。
      - name: Publish build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          RELEASE_NOTE: ${{ steps.note.outputs.message }}
          FORCE_PUBLISH: ${{ inputs.force }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir="${RUNNER_TEMP}/publish"

          # 已有产物分支就克隆下来接着提交；第一次发布时该分支还不存在。
          if ! git clone -q --branch "${TARGET_BRANCH}" --single-branch "${remote}" "${workdir}"; then
            echo "${TARGET_BRANCH} 还不存在，创建新分支"
            git init -q -b "${TARGET_BRANCH}" "${workdir}"
            git -C "${workdir}" remote add origin "${remote}"
          fi

          # 保留旧产物：旧 index.html / 旧主 chunk 可能还在浏览器或边缘缓存里（assets 带 max-age=3600），
          # 它们引用的懒加载分块必须还在，否则动态导入 404、页面只剩一张「检测到新版本」卡片。
          # 只保留最近 3 代（本次 + 前两代），避免产物分支无限膨胀 —— CFSM 拉主题包是整包下载。
          keep_assets="${RUNNER_TEMP}/keep-assets.txt"
          : > "${keep_assets}"
          if git -C "${workdir}" rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C "${workdir}" log --diff-filter=A --name-only -3 HEAD -- assets \
              | sed -n 's|^assets/||p' | sort -u > "${keep_assets}"
          fi

          cp -R dist/. "${workdir}/"

          if [ -s "${keep_assets}" ]; then
            while IFS= read -r name; do
              if [ -f "dist/assets/${name}" ]; then continue; fi
              if grep -qxF "${name}" "${keep_assets}"; then continue; fi
              rm -f "${workdir}/assets/${name}"
            done < <(find "${workdir}/assets" -maxdepth 1 -type f -printf '%f\n')
          fi

          cd "${workdir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            if [ "${FORCE_PUBLISH}" != "true" ]; then
              echo "产物与上次一致，跳过发布：$(git rev-parse HEAD)"
              exit 0
            fi
            # 只想给商店补一条更新日志时，用同样的产物再发一版。
            git commit -q --allow-empty -m "${RELEASE_NOTE}"
          else
            git commit -q -m "${RELEASE_NOTE}"
          fi
          git push -q origin "HEAD:${TARGET_BRANCH}"
          echo "已发布到 ${TARGET_BRANCH} 分支：${GITHUB_SHA::7}"
          echo "产物 commit（可用于主题商店 versions[].commitid）：$(git rev-parse HEAD)"
